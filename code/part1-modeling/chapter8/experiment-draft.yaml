acceptance:
  - holdout prediction exists with stored_at earlier than the C=16/48 request files
  - C=64 is disclosed as burned before the prediction and excluded from both fit and acceptance
  - main scan is not described as a blind prediction; only C=16/48 are holdout points
  - TPOT uses (E2EL - TTFT)/(completion_tokens - 1), not SSE chunk intervals
  - raw throughput and SLO goodput are reported separately at every point
  - P99 verdicts include the per-point failure-rate constraint, not only P99 thresholds
  - llama.cpp C=16 is reported as a marginal FAIL (TTFT P99 only 38.66 ms above 800 ms), not a robust boundary
  - 131K context is rejected by a real llama.cpp allocation failure bound to the KV ledger
  - simulator screen latency numbers are flagged unreliable; only static-memory screening is used as evidence
  - framework profile is used for relative attribution only, never as the low-overhead SLO source
  - non-equivalence ledger lists checkpoint format, precision, server path, context/slot budget, graph/compile, fusion and KV pool size
